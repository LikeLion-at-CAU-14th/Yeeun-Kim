[project]
name = "lion"
version = "0.1.0"
description = ""
authors = [
    {name = "김예은",email = "lpdms12@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "sshtunnel (>=0.4.0,<0.5.0)",
    "paramiko (<3)",
    "pillow (>=12.2.0,<13.0.0)",
    "boto3 (>=1.43.36,<2.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)"
]

[tool.poetry]
packages = [{include = "lion", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
